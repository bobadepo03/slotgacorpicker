<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Games Picker Kevin</title>

<style>
body{
    font-family: Arial;
    background: #111;
    color: white;
    padding: 20px;
}

/* CONTAINER GRID BIAR TIDAK KOSONG DI SAMPING */
#app{
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

/* CARD */
.card{
    background: #222;
    padding: 15px;
    border-radius: 10px;
}

/* LIST BIAR RAPI */
ul{
    padding-left: 20px;
}

/* RESPONSIVE UNTUK HP */
@media (max-width: 768px){
    #app{
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<h1>🎰 SLOT GACOR PICKER 🎰</h1>

<div id="app"></div>

<script src="script.js"></script>

</body>
</html>
