<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Games Picker Kevin</title>

<style>
body{
    font-family: Arial;
    background: #111;
    color: white;
    padding: 20px;
}

/* Tombol global refresh */
#refreshGlobal{
    position: absolute;
    top: 20px;
    left: 20px;
    background: #444;
    color: white;
    border: none;
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
}

/* CONTAINER GRID */
#app{
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

/* CARD */
.card{
    background: #222;
    padding: 15px;
    border-radius: 10px;
    position: relative; /* penting untuk tombol di dalam card */
}

/* Tombol refresh per-card */
.card .refreshBtn{
    position: absolute;
    bottom: 10px;
    left: 10px;
    background: #333;
    color: white;
    border: none;
    padding: 5px 10px;
    border-radius: 5px;
    cursor: pointer;
}

/* LIST */
ul{
    padding-left: 20px;
}

/* RESPONSIVE */
@media (max-width: 768px){
    #app{
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<h1>🎰 SLOT GACOR PICKER 🎰</h1>
<button id="refreshGlobal">🔄 Refresh Semua</button>

<div id="app"></div>

<script src="script.js"></script>

</body>
</html>
