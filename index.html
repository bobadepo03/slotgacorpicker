<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>$L07 G4C0R</title>

<style>
body{
    font-family: Arial;
    background: #111;
    color: white;
    padding: 20px;
}

/* Timestamp di atas judul */
#timestamp{
    text-align: left;
    color: #0f0; /* hijau digital */
    font-family: monospace;
    font-size: 14px;
    margin-bottom: 10px;
}

/* Header judul + tombol global */
.header{
    display: flex;
    justify-content: space-between;
    align-items: center;
}

/* Tombol global refresh */
#refreshGlobal{
    background: #444;
    color: white;
    border: none;
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
}

/* CONTAINER GRID */
#app{
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

/* CARD */
.card{
    background: #222;
    padding: 15px;
    border-radius: 10px;
    position: relative;
}

/* Tombol refresh per-card di kanan bawah */
.card .refreshBtn{
    position: absolute;
    bottom: 10px;
    right: 10px;
    background: #333;
    color: white;
    border: none;
    padding: 5px 10px;
    border-radius: 5px;
    cursor: pointer;
}

/* LIST */
ul{
    padding-left: 20px;
}

/* RESPONSIVE */
@media (max-width: 768px){
    #app{
        grid-template-columns: 1fr;
    }
}

/* Animasi fade-in */
.fade {
    opacity: 0;
    transition: opacity 0.5s ease-in;
}
.fade.show {
    opacity: 1;
}
</style>
</head>

<body>

<!-- Timestamp di atas judul -->
<div id="timestamp"></div>

<div class="header">
  <h1>🎰 BOBA_Picker 🎰</h1>
  <button id="refreshGlobal">🔄 Refresh Semua</button>
</div>

<div id="app"></div>

<script src="script.js"></script>

</body>
</html>
